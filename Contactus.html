<!-- CONTACT FORM -->
<div style="margin:18px 0">
<label style="font-size:12px;font-weight:bold">Your Name</label>
<input type="text" placeholder="Enter your name" style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:12px">

<label style="font-size:12px;font-weight:bold">Your Email</label>
<input type="email" placeholder="Enter your email" style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:12px">

<label style="font-size:12px;font-weight:bold">Subject</label>
<select style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:12px">
<option>Select Subject</option>
<option>Correction in Leader Info</option>
<option>Add New Leader</option>
<option>Project Help</option>
<option>Feedback</option>
<option>Other</option>
</select>

<label style="font-size:12px;font-weight:bold">Message</label>
<textarea placeholder="Write your message here..." rows="4" style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px;font-size:12px;resize:none"></textarea>

<button onclick="alert('Thank you! Message sent successfully. Jai Hind!')" style="width:100%;background:linear-gradient(90deg,#ff3c11,#ff6a33);color:white;border:none;padding:12px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer">Send Message</button>
</div>
