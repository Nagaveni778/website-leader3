<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaders Search</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#0f1115;color:#fff;margin:0;padding:20px}
.container{max-width:1100px;margin:auto}
h1{font-size:28px;margin-bottom:5px}
.search-box{position:sticky;top:10px;z-index:10;background:#0f1115;padding:10px 0}
input{width:100%;padding:16px 18px;border-radius:12px;border:1px solid #333;background:#1a1d24;color:#fff;font-size:18px;outline:none}
input:focus{border-color:#4f7cff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:20px}
.card{background:#1a1d24;border:1px solid #2a2d35;border-radius:14px;padding:14px;cursor:pointer;transition:.2s}
.card:hover{border-color:#4f7cff;transform:translateY(-2px)}
.card h3{margin:0 0 4px 0;font-size:17px}
.card p{margin:0;color:#9aa0aa;font-size:13px}
.badge{font-size:11px;background:#2a2d35;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:8px}
#detail{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;padding:20px;overflow:auto}
#detail.show{display:flex;align-items:center;justify-content:center}
.detail-box{background:#1e212a;max-width:600px;width:100%;border-radius:18px;padding:20px;position:relative}
.detail-box img{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:12px}
.close{position:absolute;right:15px;top:15px;background:#2a2d35;border:none;color:#fff;font-size:20px;width:35px;height:35px;border-radius:50%;cursor:pointer}
a.wiki{color:#4f7cff;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<h1>Leaders Directory</h1>
<p style="color:#9aa0aa;margin-top:0">Search 100+ leaders. Spelling mistake allowed.</p>
<div class="search-box">
<input id="search" type="text" placeholder="Search e.g. Modi, Gandhiji, Obama, Abdul Kalam...">
</div>
<div id="count" style="color:#9aa0aa;margin-top:10px"></div>
<div class="grid" id="grid"></div>
</div>

<div id="detail" onclick="if(event.target==this) closeDetail()">
<div class="detail-box">
<button class="close" onclick="closeDetail()">✕</button>
<div id="detailContent">Loading...</div>
</div>
</div>

{name:"Muammar Gaddafi", country:"Libya", role:"Former Leader"}

// Fuse.js for spelling mistake handling
const fuse = new Fuse(leaders, {
  keys: ['name', 'country', 'role'],
  threshold: 0.4, // 0=exact, 1=anything. 0.4 allows spelling mistakes
  distance: 100,
  includeScore: true
});

const grid = document.getElementById('grid');
const count = document.getElementById('count');
const searchInput = document.getElementById('search');

function render(list){
  count.innerText = `${list.length} leaders found`;
  grid.innerHTML = list.map(l => `
    <div class="card" onclick="openDetail('${l.name.replace(/'/g,"\\'")}')">
      <h3>${l.name}</h3>
      <p>${l.role} • ${l.country}</p>
      <span class="badge">View Wikipedia</span>
    </div>
  `).join('');
}

render(leaders);

searchInput.addEventListener('input', (e)=>{
  const q = e.target.value.trim();
  if(!q){ render(leaders); return; }
  const results = fuse.search(q).map(r=>r.item);
  render(results);
});

async function openDetail(name){
  document.getElementById('detail').classList.add('show');
  document.getElementById('detailContent').innerHTML = `<p>Loading Wikipedia for ${name}...</p>`;
  
  try{
    const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`;
    const res = await fetch(url);
    const data = await res.json();
    
    document.getElementById('detailContent').innerHTML = `
      ${data.thumbnail ? `<img src="${data.thumbnail.source}" />` : ''}
      <h2>${data.title || name}</h2>
      <p style="color:#cbd0d8;line-height:1.6">${data.extract || 'No summary found.'}</p>
      <p style="margin-top:15px"><a class="wiki" href="${data.content_urls?.desktop?.page || 'https://en.wikipedia.org/wiki/'+encodeURIComponent(name)}" target="_blank">→ Read full on Wikipedia</a></p>
      <div style="margin-top:15px">
        <small style="color:#9aa0aa">If Wikipedia page not found, it will auto search: <a class="wiki" href="https://en.wikipedia.org/w/index.php?search=${encodeURIComponent(name)}" target="_blank">Search "${name}"</a></small>
      </div>
    `;
  }catch(e){
    document.getElementById('detailContent').innerHTML = `
      <h2>${name}</h2>
      <p>Could not load Wikipedia. <a class="wiki" href="https://en.wikipedia.org/wiki/${encodeURIComponent(name)}" target="_blank">Open Wikipedia</a></p>
    `;
  }
}
function closeDetail(){ document.getElementById('detail').classList.remove('show'); }
</script>
</body>
